{% extends "layout.html" %}
{% block content %}
<div class="card login-card">
    <h2>Login & API Validation</h2>
    <p>Enter your Taqtics External API credentials to proceed.</p>

    <div class="form-group">
        <label>Subdomain</label>
        <input type="text" id="subdomain" placeholder="example.taqtics.co" value="impl4.taqtics.co">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@taqtics.co">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button id="validate-btn" class="btn-primary">Validate API Access</button>

    <div id="status-msg" class="status-msg"></div>
</div>

<script>
    document.getElementById('validate-btn').addEventListener('click', async () => {
        const btn = document.getElementById('validate-btn');
        const msg = document.getElementById('status-msg');
        const subdomain = document.getElementById('subdomain').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.innerText = 'Validating...';
        msg.innerText = 'Connecting to Taqtics...';
        msg.className = 'status-msg';

        try {
            const response = await fetch('/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ subdomain, email, password })
            });
            const result = await response.json();

            msg.innerText = result.message;
            if (result.success) {
                msg.className = 'status-msg success';
                setTimeout(() => {
                    window.location.href = '/setup';
                }, 1000);
            } else {
                msg.className = 'status-msg error';
                btn.disabled = false;
                btn.innerText = 'Validate API Access';
            }
        } catch (e) {
            msg.innerText = '❌ Request failed';
            msg.className = 'status-msg error';
            btn.disabled = false;
            btn.innerText = 'Validate API Access';
        }
    });
</script>
{% endblock %}
